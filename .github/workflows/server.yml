# Bridge (server/): test every change; on main, publish a GitHub release with standalone
# kits for macOS and Linux. Version = SERIES.<COUNT_OFFSET + commits touching server/>;
# the offset continues the numbering of the monorepo this was split from. Bump SERIES by hand.
name: Bridge release
on:
  push:
    branches: [main]
    paths: [server/**, protocol/**, .github/**]
  pull_request:
    paths: [server/**, .github/workflows/server.yml]
  workflow_dispatch:
concurrency:
  group: server-release-${{ github.ref }}
  cancel-in-progress: false
permissions: { contents: read }
env:
  SERIES: "0.1"
  BUN_VERSION: "1.4.4"
  COUNT_OFFSET: "20"
jobs:
  test:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "${{ env.BUN_VERSION }}" }
      - id: v
        run: echo "version=$(.github/scripts/component-release.sh version "$SERIES" server)" >> "$GITHUB_OUTPUT"
      - working-directory: server
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test

  linux:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "${{ env.BUN_VERSION }}" }
      - working-directory: server
        run: |
          bun install --frozen-lockfile
          for t in bun-linux-x64 bun-linux-arm64; do scripts/package-release.sh "${{ needs.test.outputs.version }}" "$t" ../dist; done
          # Smoke test the x64 kit on this runner.
          mkdir -p /tmp/kit && unzip -q ../dist/*-linux-x64.zip -d /tmp/kit
          /tmp/kit/agent-remote/herdr-remote --help | grep -F "host ${{ needs.test.outputs.version }}"
          /tmp/kit/agent-remote/herdr-remote init --state /tmp/kit/state --url https://127.0.0.1:18443 --port 18443
      - uses: actions/upload-artifact@v4
        with: { name: bridge-linux, path: dist/*.zip, if-no-files-found: error }

  macos:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "${{ env.BUN_VERSION }}" }
      - working-directory: server
        run: |
          bun install --frozen-lockfile
          for t in bun-darwin-arm64 bun-darwin-x64; do scripts/package-release.sh "${{ needs.test.outputs.version }}" "$t" ../dist; done
          # This runner is Apple silicon: run the arm64 kit with only the stock system tools.
          mkdir -p /tmp/kit && unzip -q ../dist/*-macos-arm64.zip -d /tmp/kit
          env -i HOME=/tmp/kit PATH=/usr/bin:/bin:/usr/sbin:/sbin /tmp/kit/agent-remote/herdr-remote --help | grep -F "host ${{ needs.test.outputs.version }}"
          env -i HOME=/tmp/kit PATH=/usr/bin:/bin:/usr/sbin:/sbin /tmp/kit/agent-remote/herdr-remote init --state /tmp/kit/state --url https://127.0.0.1:18443 --port 18443
      - uses: actions/upload-artifact@v4
        with: { name: bridge-macos, path: dist/*.zip, if-no-files-found: error }

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, linux, macos]
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          tag="server-v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then echo "$tag already released"; exit 0; fi
          (cd dist && sha256sum *.zip > SHA256SUMS)
          {
            echo "Standalone AI Agent Remote bridge $VERSION. Download the zip for your computer, unzip it and follow README.txt (\`./herdr-remote up\`)."
            echo
            echo "| Computer | File |"
            echo "|---|---|"
            echo "| Mac with Apple silicon (M1 and later) | agent-remote-bridge-$VERSION-macos-arm64.zip |"
            echo "| Intel Mac | agent-remote-bridge-$VERSION-macos-x64.zip |"
            echo "| Linux x86-64 | agent-remote-bridge-$VERSION-linux-x64.zip |"
            echo "| Linux ARM64 | agent-remote-bridge-$VERSION-linux-arm64.zip |"
            echo
            echo "## Changes"
            .github/scripts/component-release.sh notes server-v server
          } > notes.md
          gh release create "$tag" dist/*.zip dist/SHA256SUMS --target "$GITHUB_SHA" --title "Bridge $VERSION" --notes-file notes.md

  # Container image of the released Linux kits: ghcr.io/gremia-tech/agent-remote-bridge:VERSION and :latest.
  container:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, release]
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.test.outputs.version }}
        run: gh release download "server-v$VERSION" -p '*-linux-*.zip' -p SHA256SUMS -D dist && (cd dist && sha256sum --check --ignore-missing SHA256SUMS)
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ github.token }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/container/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.test.outputs.version }}
          push: true
          tags: |
            ghcr.io/gremia-tech/agent-remote-bridge:${{ needs.test.outputs.version }}
            ghcr.io/gremia-tech/agent-remote-bridge:latest
      - run: docker run --rm "ghcr.io/gremia-tech/agent-remote-bridge:${{ needs.test.outputs.version }}" --help | grep -F "host ${{ needs.test.outputs.version }}"

  # Homebrew formula kept in this repository's Formula/ folder:
  #   brew tap gremia-tech/agent-remote-bridge https://github.com/gremia-tech/agent-remote-bridge
  #   brew install agent-remote-bridge
  homebrew:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, release]
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          gh release download "server-v$VERSION" -p SHA256SUMS -D /tmp/dist
          mkdir -p Formula && .github/scripts/homebrew-formula.sh "$VERSION" /tmp/dist/SHA256SUMS > Formula/agent-remote-bridge.rb
          git add Formula && if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Homebrew formula for bridge $VERSION"
          git pull -q --rebase origin main && git push -q origin HEAD:main
